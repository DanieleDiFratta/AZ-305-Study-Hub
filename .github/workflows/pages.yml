name: Dashboard statica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Controlli del catalogo e del sito
        run: python -B -m unittest discover -s tests -v
      - name: Genera la dashboard
        run: python -B scripts/build_site.py
      - name: Carica soltanto il sito generato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4